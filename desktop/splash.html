<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:" />
<title>Flowline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0b1426; color: #e6edf7; font: 13px/1.45 system-ui, sans-serif;
    display: flex; flex-direction: column; padding: 28px 30px 22px; -webkit-app-region: drag;
    border: 1px solid #24365c; border-radius: 10px;
  }
  header { display: flex; align-items: center; gap: 14px; }
  header img { width: 44px; height: 44px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: 0.32em; font-weight: 600; }
  #title { margin: 18px 0 6px; font-weight: 600; }
  .bar { height: 3px; background: #1a2a4a; border-radius: 2px; overflow: hidden; }
  .bar span { display: block; width: 35%; height: 100%; background: #f5a524; animation: go 1.2s ease-in-out infinite; }
  @keyframes go { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation-duration: 4s; } }
  #log {
    flex: 1; margin-top: 12px; overflow: hidden; color: #8ca0c3; font: 11.5px/1.5 ui-monospace, monospace;
    display: flex; flex-direction: column; justify-content: flex-end; white-space: pre-wrap; word-break: break-word;
  }
  #log div:last-child { color: #e6edf7; }
  footer { display: none; gap: 8px; margin-top: 12px; -webkit-app-region: no-drag; }
  button { font: inherit; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid #24365c; background: #121e36; color: #e6edf7; }
  button.primary { background: #f5a524; border-color: #f5a524; color: #0b1426; font-weight: 600; }
  .failed #title { color: #f87171; }
  .failed .bar { display: none; }
  .failed footer { display: flex; }
  small { color: #8ca0c3; margin-top: 10px; }
</style>
</head>
<body>
  <header><img src="build/icon.png" alt="" /><h1>FLOWLINE</h1></header>
  <div id="title">Starting Flowline…</div>
  <div class="bar"><span></span></div>
  <div id="log" role="log" aria-live="polite"></div>
  <footer>
    <button id="logs">Open logs</button>
    <button class="primary" id="quit">Quit</button>
  </footer>
  <small>Docker must be running. First start can take several minutes.</small>
<script>
  const box = document.getElementById("log");
  const title = document.getElementById("title");
  function add(line) {
    const d = document.createElement("div");
    d.textContent = line;
    box.appendChild(d);
    while (box.children.length > 14) box.firstChild.remove();
  }
  window.flowline.onStatus(add);
  window.flowline.onFailed((msg) => { document.body.classList.add("failed"); title.textContent = "Flowline could not start"; add(msg); });
  window.flowline.onMode((mode) => { if (mode === "stopping") title.textContent = "Stopping Flowline…"; });
  document.getElementById("quit").onclick = () => window.flowline.quit();
  document.getElementById("logs").onclick = () => window.flowline.openLogs();
</script>
</body>
</html>
